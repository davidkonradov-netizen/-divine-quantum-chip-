name: Publish and Scan Docker Images to GHCR

on:
  push:
    branches: [ infra/openapi-client ]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-scan-sign-push:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/patrones-matematicos
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR (if CR_PAT provided)
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}
        if: secrets.CR_PAT != ''

      - name: Build and push image to GHCR (only if CR_PAT provided)
        uses: docker/build-push-action@v5
        with:
          context: mi-proyecto
          file: mi-proyecto/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
        if: secrets.CR_PAT != ''

      - name: Build image locally (for scanning when not pushing)
        if: secrets.CR_PAT == ''
        run: |
          docker build -t patrones-matematicos:ci mi-proyecto

      - name: Scan image with Trivy (fail on HIGH)
        uses: aquasecurity/trivy-action@v2
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
        if: secrets.CR_PAT != ''

      - name: Scan local image with Trivy (ci image)
        if: secrets.CR_PAT == ''
        uses: aquasecurity/trivy-action@v2
        with:
          image-ref: patrones-matematicos:ci

      - name: Install cosign
        run: |
          curl -sSL "https://github.com/sigstore/cosign/releases/download/v1.15.1/cosign-linux-amd64" -o /usr/local/bin/cosign
          chmod +x /usr/local/bin/cosign

      - name: Sign image with cosign (if COSIGN_KEY provided)
        if: secrets.COSIGN_KEY != '' && secrets.CR_PAT != ''
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          echo "$COSIGN_KEY" | base64 --decode > cosign.key
          cosign sign --key cosign.key ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Upload image digest as artifact
        if: secrets.CR_PAT != ''
        run: |
          echo "IMAGE=${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}" > image.txt
        uses: actions/upload-artifact@v4
        with:
          name: image-ref
          path: image.txt
