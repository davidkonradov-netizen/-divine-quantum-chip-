apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: virtualmachines.infra.example.com
spec:
  group: infra.example.com
  names:
    plural: virtualmachines
    singular: virtualmachine
    kind: VirtualMachine
    shortNames:
      - vm
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: ["spec"]
          properties:
            spec:
              type: object
              required: ["image", "resources"]
              properties:
                image:
                  type: string
                kind:
                  type: string
                  enum: ["kvm", "microvm", "container"]
                resources:
                  type: object
                  properties:
                    cpu:
                      type: number
                    memGiB:
                      type: number
                    gpus:
                      type: integer
                    tpus:
                      type: integer
                deviceBindings:
                  type: array
                  items:
                    type: object
                    properties:
                      deviceID:
                        type: string
                      mode:
                        type: string
                        enum: ["passthrough","vfio","emulated"]
                topologyPreferences:
                  type: object
                  additionalProperties: true
      subresources:
        status: {}
